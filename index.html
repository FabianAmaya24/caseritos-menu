<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Los caseritos — Pedidos por WhatsApp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --white:#FFFFFF;
    --offwhite:#F8F6F2;
    --red:#E4262B;
    --red-dark:#B81E22;
    --orange:#F5A93C;
    --green:#3FA24A;
    --ink:#221E1D;
    --ink-soft:#7A716B;
    --line:rgba(34,30,29,0.11);
    --radius-img:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--offwhite);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:150px;
  }
  h1,h2,h3{font-family:'Fraunces',serif;margin:0;}

  /* PROMO BANNER */
  .promo-banner{
    background:var(--red);
    color:var(--white);
    padding:11px 20px;
    display:flex;align-items:center;justify-content:space-between;
    gap:10px;
    cursor:pointer;
    border:none;width:100%;
    font-family:'Inter',sans-serif;
  }
  .promo-left{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:700;}
  .promo-see{
    background:var(--white);color:var(--red);
    font-size:12.5px;font-weight:700;
    padding:5px 14px;border-radius:16px;
    flex-shrink:0;
  }

  /* HEADER */
  .top{
    background:var(--white);
    padding:18px 20px 14px;
    border-bottom:1px solid var(--line);
  }
  .top-row{display:flex;align-items:center;gap:13px;}
  .logo-badge{
    width:52px;height:52px;
    border-radius:12px;
    background:var(--ink);
    display:flex;align-items:center;justify-content:center;
    font-size:24px;
    flex-shrink:0;
    color:var(--white);
  }
  .biz-name{font-size:22px;font-weight:700;line-height:1.15;color:var(--ink);}
  .biz-tag{font-size:12.8px;color:var(--ink-soft);margin-top:2px;}
  .top-meta{
    margin-top:13px;
    display:flex;flex-wrap:wrap;gap:8px 16px;
    font-size:12.3px;color:var(--ink-soft);
  }
  .status-pill{
    display:inline-flex;align-items:center;gap:6px;
    color:var(--green);font-weight:700;
  }
  .status-dot{width:7px;height:7px;border-radius:50%;background:var(--green);}
  .status-pill.closed{color:var(--red-dark);}
  .status-pill.closed .status-dot{background:var(--red-dark);}

  /* CATEGORY NAV */
  .cat-nav{
    position:sticky;top:0;z-index:20;
    background:var(--white);
    border-bottom:1px solid var(--line);
    padding:12px 20px;
    display:flex;
    gap:10px;
    overflow-x:auto;
    scrollbar-width:none;
  }
  .cat-nav::-webkit-scrollbar{display:none;}
  .cat-btn{
    background:none;
    border:1.5px solid transparent;
    font-family:'Inter',sans-serif;
    font-size:13.5px;font-weight:600;
    color:var(--ink-soft);
    white-space:nowrap;
    padding:7px 14px;
    border-radius:20px;
    cursor:pointer;
  }
  .cat-btn.active{
    color:var(--red);
    border-color:var(--red);
    background:var(--white);
  }

  /* MENU */
  .menu-wrap{padding:22px 20px 8px;max-width:640px;margin:0 auto;}
  .cat-section{margin-bottom:28px;}
  .cat-heading{
    font-size:20px;font-weight:600;color:var(--red);
    margin-bottom:2px;
  }
  .cat-sub{font-size:12.5px;color:var(--ink-soft);margin-bottom:12px;}

  .item{
    display:flex;
    gap:14px;
    padding:15px 0;
    border-bottom:1px solid var(--line);
    position:relative;
  }
  .item:last-child{border-bottom:none;}
  .item-img{
    width:78px;height:78px;
    border-radius:var(--radius-img);
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-size:32px;
    position:relative;
    background:var(--offwhite);
    border:1px solid var(--line);
    overflow:hidden;
  }
  .item-img img{
    width:100%;height:100%;
    object-fit:cover;
    border-radius:var(--radius-img);
  }
  .discount-flag{
    position:absolute;
    top:-6px;left:-6px;
    background:var(--orange);
    color:var(--ink);
    font-size:10.5px;font-weight:700;
    padding:2px 6px;
    border-radius:5px;
    box-shadow:0 1px 2px rgba(0,0,0,0.15);
  }
  .item-info{flex:1;min-width:0;}
  .item-name{font-size:15.2px;font-weight:700;color:var(--ink);}
  .item-desc{
    font-size:12.6px;color:var(--ink-soft);
    margin-top:2px;line-height:1.4;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .item-bottom{
    display:flex;align-items:center;justify-content:space-between;
    margin-top:9px;
  }
  .price-row{display:flex;align-items:baseline;gap:7px;}
  .price-now{font-size:15px;font-weight:700;color:var(--red);}
  .price-old{font-size:12.3px;color:var(--ink-soft);text-decoration:line-through;}

  .add-btn{
    width:30px;height:30px;border-radius:8px;
    background:var(--red);color:var(--white);
    border:none;font-size:19px;font-weight:600;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    transition:transform .12s ease;
    flex-shrink:0;
  }
  .add-btn:active{transform:scale(0.88);}

  .stepper{
    display:flex;align-items:center;gap:10px;
    background:var(--red);
    border-radius:8px;
    padding:3px 5px;
  }
  .stepper button{
    width:24px;height:24px;border-radius:6px;
    background:var(--white);color:var(--red);
    border:none;font-size:15px;font-weight:700;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .stepper span{color:var(--white);font-size:13.5px;font-weight:700;min-width:14px;text-align:center;}

  /* FLOATING CART BAR */
  .cart-bar{
    position:fixed;left:16px;right:16px;bottom:70px;
    background:var(--red);color:var(--white);
    border-radius:14px;
    padding:13px 16px;
    display:flex;align-items:center;justify-content:space-between;
    box-shadow:0 8px 24px rgba(180,30,30,0.35);
    z-index:30;
    transform:translateY(120%);
    transition:transform .28s cubic-bezier(.2,.9,.3,1);
  }
  .cart-bar.show{transform:translateY(0);}
  .cart-bar-info{font-size:13.5px;line-height:1.3;}
  .cart-bar-info b{font-size:15px;display:block;}
  .cart-bar-btn{
    background:var(--white);color:var(--red);
    border:none;border-radius:9px;
    padding:9px 16px;font-weight:700;font-size:13.5px;
    cursor:pointer;
  }

  /* DRAWER */
  .overlay{
    position:fixed;inset:0;background:rgba(34,30,29,0.5);
    z-index:40;opacity:0;pointer-events:none;
    transition:opacity .25s ease;
  }
  .overlay.show{opacity:1;pointer-events:auto;}
  .drawer{
    position:fixed;left:0;right:0;bottom:0;
    max-width:640px;margin:0 auto;
    background:var(--white);
    border-radius:18px 18px 0 0;
    z-index:41;
    max-height:82vh;
    display:flex;flex-direction:column;
    transform:translateY(100%);
    transition:transform .3s cubic-bezier(.2,.9,.3,1);
  }
  .drawer.show{transform:translateY(0);}
  .drawer-handle{
    width:38px;height:4px;background:var(--line);
    border-radius:3px;margin:10px auto 4px;
  }
  .drawer-head{
    padding:6px 20px 14px;
    display:flex;align-items:center;justify-content:space-between;
    border-bottom:1px solid var(--line);
  }
  .drawer-head h2{font-size:19px;}
  .drawer-close{background:none;border:none;font-size:22px;color:var(--ink-soft);cursor:pointer;}
  .drawer-body{padding:14px 20px;overflow-y:auto;flex:1;}
  .empty-msg{text-align:center;color:var(--ink-soft);font-size:14px;padding:30px 0;}

  .cart-row{
    display:flex;align-items:center;justify-content:space-between;
    padding:11px 0;border-bottom:1px solid var(--line);
    gap:10px;
  }
  .cart-row-name{font-size:14px;font-weight:700;}
  .cart-row-price{font-size:12.5px;color:var(--ink-soft);}
  .cart-row-remove{
    background:none;border:none;color:var(--red);
    font-size:12px;text-decoration:underline;cursor:pointer;padding:0;margin-top:3px;
  }

  .notes-label{font-size:13px;font-weight:600;margin:16px 0 6px;display:block;}
  .notes-input{
    width:100%;border:1px solid var(--line);border-radius:9px;
    padding:10px 12px;font-family:'Inter',sans-serif;font-size:13.5px;
    resize:none;background:var(--offwhite);
  }
  .notes-input:focus{outline:2px solid var(--orange);}

  .drawer-foot{
    padding:14px 20px 22px;
    border-top:1px solid var(--line);
    background:var(--white);
  }
  .total-row{
    display:flex;justify-content:space-between;
    font-size:15.5px;font-weight:700;margin-bottom:12px;
  }
  .send-btn{
    width:100%;background:var(--red);color:var(--white);
    border:none;border-radius:12px;padding:14px;
    font-size:15px;font-weight:700;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:9px;
  }
  .send-btn:disabled{background:#DCC9C4;cursor:not-allowed;}
  .send-btn svg{width:19px;height:19px;flex-shrink:0;}

  @media (prefers-reduced-motion: reduce){
    .cart-bar,.drawer,.overlay,.add-btn{transition:none;}
  }
</style>
</head>

/* ============================================================

document.getElementById("bizName").textContent = CONFIG.businessName;
  // Formatea números al estilo argentino: punto cada tres cifras, sin decimales.
function formatPrice(n){
  return CONFIG.currency + n.toLocaleString('es-AR', {minimumFractionDigits:0, maximumFractionDigits:0});
}
document.getElementById("bizTag").textContent = CONFIG.tagline;
document.getElementById("logoBadge").textContent = CONFIG.logoEmoji;
const statusPill = document.getElementById("statusPill");

function isWithinSchedule(){
  const now = new Date();
  const minutesNow = now.getHours() * 60 + now.getMinutes();
  return CONFIG.schedule.some(range => {
    const [sh, sm] = range.start.split(":").map(Number);
    const [eh, em] = range.end.split(":").map(Number);
    const startMin = sh * 60 + sm;
    const endMin = eh * 60 + em;
    if(endMin <= startMin){
      return minutesNow >= startMin || minutesNow < endMin;
    }
    return minutesNow >= startMin && minutesNow < endMin;
  });
}

function updateOpenStatus(){
  if(isWithinSchedule()){
    statusPill.classList.remove("closed");
    statusPill.innerHTML = '<span class="status-dot"></span> Abierto ahora';
  } else {
    statusPill.classList.add("closed");
    statusPill.innerHTML = '<span class="status-dot"></span> Cerrado por ahora';
  }
}
updateOpenStatus();
setInterval(updateOpenStatus, 60000);

// Banner de promos dinámico: toma el mayor descuento de la categoría "Promos"
const promoItems = PRODUCTS.filter(p => p.cat === "Promos" && p.oldPrice);
if(promoItems.length){
  const best = promoItems.reduce((a,b) => {
    const da = 1 - a.price/a.oldPrice, db = 1 - b.price/b.oldPrice;
    return db > da ? b : a;
  });
  const pct = Math.round((1 - best.price/best.oldPrice) * 100);
  document.getElementById("promoText").textContent = `🎉 Promos con hasta ${pct}% de descuento`;
} else {
  document.getElementById("promoBanner").style.display = "none";
}
document.getElementById("promoBanner").onclick = () => {
  const promoSection = document.getElementById("sec-Promos");
  if(promoSection) promoSection.scrollIntoView({behavior:"smooth", block:"start"});
};

const cats = [...new Set(PRODUCTS.map(p => p.cat))];
const catNav = document.getElementById("catNav");
const menuWrap = document.getElementById("menuWrap");
let cart = {}; // { productId: qty }

cats.forEach((cat, i) => {
  const btn = document.createElement("button");
  btn.className = "cat-btn" + (i === 0 ? " active" : "");
  btn.textContent = cat;
  btn.dataset.cat = cat;
  btn.onclick = () => {
    document.getElementById("sec-" + cat).scrollIntoView({behavior:"smooth", block:"start"});
  };
  catNav.appendChild(btn);

  const section = document.createElement("section");
  section.className = "cat-section";
  section.id = "sec-" + cat;
  const items = PRODUCTS.filter(p => p.cat === cat);
  section.innerHTML = `<h2 class="cat-heading">${cat}</h2><p class="cat-sub">${items.length} opciones</p>`;
  items.forEach(p => section.appendChild(renderItem(p)));
  menuWrap.appendChild(section);
});

function renderItem(p){
  const row = document.createElement("div");
  row.className = "item";
  const discountPct = p.oldPrice ? Math.round((1 - p.price / p.oldPrice) * 100) : null;
  const isPhoto = /^https?:\/\//.test(p.img);
  const imgContent = isPhoto
    ? `<img src="${p.img}" alt="${p.name}">`
    : p.img;
  row.innerHTML = `
    <div class="item-img">
      ${discountPct ? `<span class="discount-flag">-${discountPct}%</span>` : ""}
      ${imgContent}
    </div>
    <div class="item-info">
      <div class="item-name">${p.name}</div>
      <div class="item-desc">${p.desc}</div>
      <div class="item-bottom">
        <div class="price-row">
          <span class="price-now">${formatPrice(p.price)}</span>
         ${p.oldPrice ? `<span class="price-old">${formatPrice(p.oldPrice)}</span>` : ""}
        </div>
        <div class="qty-slot" id="qty-${p.id}">
          <button class="add-btn" onclick="changeQty(${p.id},1)">+</button>
        </div>
      </div>
    </div>
  `;
  return row;
}

function renderQtyControl(id){
  const slot = document.getElementById(`qty-${id}`);
  if(!slot) return;
  const qty = cart[id] || 0;
  if(qty === 0){
    slot.innerHTML = `<button class="add-btn" onclick="changeQty(${id},1)">+</button>`;
  } else {
    slot.innerHTML = `
      <div class="stepper">
        <button onclick="changeQty(${id},-1)">−</button>
        <span>${qty}</span>
        <button onclick="changeQty(${id},1)">+</button>
      </div>`;
  }
}

function changeQty(id, delta){
  cart[id] = (cart[id] || 0) + delta;
  if(cart[id] <= 0) delete cart[id];
  renderQtyControl(id);
  updateCartBar();
  renderDrawer();
}

function cartEntries(){
  return Object.entries(cart).map(([id, qty]) => {
    const product = PRODUCTS.find(p => p.id === Number(id));
    return {product, qty};
  });
}

function cartTotal(){
  return cartEntries().reduce((sum, e) => sum + e.product.price * e.qty, 0);
}

function cartCount(){
  return Object.values(cart).reduce((a,b) => a+b, 0);
}

const cartBar = document.getElementById("cartBar");
function updateCartBar(){
  const count = cartCount();
  document.getElementById("cartBarCount").textContent = count === 1 ? "1 producto" : `${count} productos`;
  document.getElementById("cartBarTotal").textContent = formatPrice(cartTotal());
  cartBar.classList.toggle("show", count > 0);
  document.getElementById("sendBtn").disabled = count === 0;
}

const overlay = document.getElementById("overlay");
const drawer = document.getElementById("drawer");

function openDrawer(){
  renderDrawer();
  overlay.classList.add("show");
  drawer.classList.add("show");
}
function closeDrawer(){
  overlay.classList.remove("show");
  drawer.classList.remove("show");
}
document.getElementById("openCartBtn").onclick = openDrawer;
document.getElementById("closeCartBtn").onclick = closeDrawer;
overlay.onclick = closeDrawer;

function renderDrawer(){
  const body = document.getElementById("drawerBody");
  const entries = cartEntries();
  if(entries.length === 0){
    body.innerHTML = `<p class="empty-msg">Tu pedido está vacío. Agrega algo del menú para empezar.</p>`;
  } else {
    body.innerHTML = entries.map(e => `
      <div class="cart-row">
        <div>
          <div class="cart-row-name">${e.qty} × ${e.product.name}</div>
          <div class="cart-row-price">${formatPrice(e.product.price * e.qty)}</div>
          <button class="cart-row-remove" onclick="removeItem(${e.product.id})">Quitar</button>
        </div>
      </div>
    `).join("") + `
      <label class="notes-label" for="notesField">Notas para tu pedido (opcional)</label>
      <textarea class="notes-input" id="notesField" rows="2" placeholder="Ej: dirección de entrega, sin cebolla, etc.">${window.__orderNotes || ""}</textarea>
    `;
    document.getElementById("notesField").oninput = (e) => { window.__orderNotes = e.target.value; };
  }
  document.getElementById("drawerTotal").textContent = formatPrice(cartTotal());
}

function removeItem(id){
  delete cart[id];
  renderQtyControl(id);
  updateCartBar();
  renderDrawer();
}

document.getElementById("sendBtn").onclick = () => {
  const entries = cartEntries();
  if(entries.length === 0) return;
  let msg = `Hola ${CONFIG.businessName}, quiero hacer este pedido:\n\n`;
  entries.forEach(e => {
    msg += `• ${e.qty} × ${e.product.name} — ${formatPrice(e.product.price * e.qty)}\n`;
  });
  msg += `\nTotal: ${formatPrice(cartTotal())}`;
  if(window.__orderNotes){
    msg += `\n\nNotas: ${window.__orderNotes}`;
  }
  const url = `https://wa.me/${CONFIG.whatsappNumber}?text=${encodeURIComponent(msg)}`;
  window.open(url, "_blank");
};

updateCartBar();
